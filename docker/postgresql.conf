# PostgreSQL 16 configuration tuned for reproducible MSc thesis benchmarks
# Host reference: Ryzen 5 9600X (6C/12T), 31.6 GB RAM, SSD

listen_addresses = '*'

# Extensions
shared_preload_libraries = 'pg_hint_plan,pg_stat_statements'
pg_hint_plan.enable_hint = on
pg_hint_plan.parse_messages = warning

# Memory (fits IMDb ~8.5 GB indexed + working set; suitable for TPC-H SF=10)
shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 256MB
maintenance_work_mem = 2GB

# Parallelism & I/O
max_worker_processes = 8
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL & Checkpoints (faster bulk data loading & index builds)
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Planner / Statistics
default_statistics_target = 100
geqo_threshold = 18

# pg_stat_statements
pg_stat_statements.max = 10000
pg_stat_statements.track = all
